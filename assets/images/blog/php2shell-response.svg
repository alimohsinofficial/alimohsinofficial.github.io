  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(76 306)"><rect width="214" height="152" rx="16" fill="#1c2630" stroke="#405264"/><text x="20" y="34" fill="#a4b9d0" font-family="Consolas,monospace" font-size="14">01 / INVENTORY</text><text x="20" y="80" fill="#eef2f6" font-size="20">Find the runtime.</text><text x="20" y="119" fill="#aebdcd" font-size="16">Apps · hosts · suppliers</text></g>
    <g transform="translate(348 306)"><rect width="214" height="152" rx="16" fill="#1c2630" stroke="#405264"/><text x="20" y="34" fill="#a4b9d0" font-family="Consolas,monospace" font-size="14">02 / PATCH</text><text x="20" y="80" fill="#eef2f6" font-size="20">Fix the dependency.</text><text x="20" y="119" fill="#aebdcd" font-size="16">Supported vendor build</text></g>
    <g transform="translate(620 306)"><rect width="214" height="152" rx="16" fill="#233243" stroke="#8daac8"/><text x="20" y="34" fill="#c4d7eb" font-family="Consolas,monospace" font-size="14">03 / VERIFY</text><text x="20" y="80" fill="#eef2f6" font-size="20">Check what runs.</text><text x="20" y="119" fill="#c4d1de" font-size="16">Serving workers · images</text></g>
    <g transform="translate(892 306)"><rect width="232" height="152" rx="16" fill="#1c2630" stroke="#405264"/><text x="20" y="34" fill="#a4b9d0" font-family="Consolas,monospace" font-size="14">04 / INVESTIGATE</text><text x="20" y="80" fill="#eef2f6" font-size="20">Review the window.</text><text x="20" y="119" fill="#aebdcd" font-size="16">Logs · processes · files</text></g>
