  <g font-family="Consolas,monospace" font-size="14" fill="#a6b5c5"><text x="76" y="559">EVIDENCE AT EVERY STAGE</text><text x="1124" y="559" text-anchor="end">MOHSIN ALI / ORIGINAL SCHEMATIC</text></g>
